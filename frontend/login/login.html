<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Student Management System</title>
    
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../shared/style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="site-header">
        <div class="header-container">
            <div class="brand">
                <span class="brand-logo" aria-hidden="true">🎓</span>
                <div>
                    <h2 class="brand-title">Student Management System</h2>
                    <p class="brand-subtitle">Login to your account</p>
                </div>
            </div>
        </div>
    </header>

    <!-- ===== LOGIN SECTION ===== -->
    <main class="container">
        <section class="login-section">
            
            <!-- Heading -->
            <h1>Login</h1>

            <!-- Login Form -->
            <form id="loginForm" class="login-form" autocomplete="on" novalidate>
                
                <!-- Email or Username -->
                <div class="form-group">
                    <label for="loginIdentifier">Email or Username</label>
                    <input 
                        type="text" 
                        id="loginIdentifier" 
                        placeholder="Enter email or username" 
                        required
                        autofocus
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input 
                        type="password" 
                        id="loginPassword" 
                        placeholder="Enter your password" 
                        required
                    >
                </div>

                <!-- Status Message -->
                <div id="loginStatus" class="login-status"></div>

                <!-- Login Button -->
                <button type="submit" class="btn-login" id="loginBtn">
                    Login
                </button>

                <!-- Register Link -->
                <p class="login-footer">
                    Don't have an account? 
                    <a href="../register/register.html">Register</a>
                </p>

            </form>

        </section>
    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="site-footer">
        <p>&copy; 2026 Student Management System</p>
        <p>CSE 3200 Web Programming Sessional Final Project</p>
    </footer>

    <script src="../shared/common.js"></script>
    <script src="login.js"></script>
</body>
</html>
